<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>حجز موعد | مستشفى طيبة</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head>
<body class="inner-page"><div class="ambient-bg" aria-hidden="true"></div><div data-include="components/topbar.html"></div><div data-include="components/navbar.html"></div><main class="standalone-page booking-page"><a class="back-home-btn" href="index.html"><i class="fa-solid fa-house"></i> العودة للرئيسية</a><section class="booking-section"><div class="booking-copy"><span class="eyebrow">نحن هنا من أجلك</span><h1>احجز موعدك الآن</h1><p>املأ البيانات واختر القسم والطبيب المناسب. هذا نموذج تجريبي لمشروع تعليمي.</p><div class="booking-benefit"><i class="fa-solid fa-calendar-check"></i> حجز سهل وسريع</div><div class="booking-benefit"><i class="fa-solid fa-user-doctor"></i> اختيار الطبيب المناسب</div></div><form class="home-booking-form" id="standaloneBookingForm"><h2>طلب حجز موعد</h2><label for="patientName">الاسم بالكامل</label><input id="patientName" type="text" required placeholder="اكتب الاسم بالكامل"><label for="patientPhone">رقم الهاتف</label><input id="patientPhone" type="tel" required pattern="[0-9+\s-]{8,18}" placeholder="رقم الهاتف"><label for="department">اختار القسم</label><select id="department" required><option value="">اختار القسم</option><option>القلب</option><option>العيون</option><option>الأطفال</option><option>الأسنان</option><option>الجلدية</option><option>العظام</option><option>الباطنة</option><option>النساء والتوليد</option><option>المخ والأعصاب</option><option>الأنف والأذن والحنجرة</option></select><label for="doctor">اختار الطبيب</label><select id="doctor" required><option value="">اختار الطبيب</option><option>د. أحمد محمد</option><option>د. سارة علي</option><option>د. محمود حسن</option><option>د. منى إبراهيم</option></select><label for="date">اختار التاريخ</label><input id="date" type="date" required><button class="btn" type="submit">تأكيد الحجز</button><p id="bookingResult" class="small-note" aria-live="polite">هذا نموذج تجريبي ولا يرسل البيانات إلى المستشفى.</p></form></section></main><script src="components.js"></script><script>document.getElementById('standaloneBookingForm').addEventListener('submit',function(e){e.preventDefault();const n=document.getElementById('patientName').value.trim(),d=document.getElementById('department').value,doc=document.getElementById('doctor').value,date=document.getElementById('date').value;document.getElementById('bookingResult').textContent=`تم تسجيل طلب حجز تجريبي باسم ${n} في قسم ${d} مع ${doc} بتاريخ ${date}.`;});</script></body></html>
