<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تسجيل الدخول | مستشفى طيبة</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><div class="ambient-bg"></div><main class="login-card"><div style="font-size:55px;color:#d84d68">❤</div><h1>مستشفى طيبة</h1><p>أهلاً بكِ، سجّلي بياناتك للدخول إلى الموقع</p><form action="index.html" method="get"><input id="userName" type="text" placeholder="الاسم بالكامل" required maxlength="60"><input id="userEmail" type="email" placeholder="البريد الإلكتروني" required><input id="userPassword" type="password" placeholder="كلمة المرور" required minlength="4"><div class="form-error" id="loginError"></div><button class="btn" type="submit">دخول إلى المستشفى</button></form><p class="small-note">واجهة دخول تجريبية لمشروع تعليمي؛ لا تُرسل البيانات إلى خادم.</p></main></body></html>
